<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wakizashi 3D Model</title>
<style>
:root{--bg:#eceae5;--fg:#1d1b;--panel:#ffffffcc;--line:#00000022;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--fg:#e8e6e1;--panel:#22242acc;--line:#ffffff22}}
:root[data-theme="dark"]{--bg:#17181b;--fg:#e8e6e1;--panel:#22242acc;--line:#ffffff22}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas#v{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;pointer-events:none}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;pointer-events:auto;backdrop-filter:blur(6px)}
.box label{display:flex;gap:8px;align-items:center;margin:4px 0}
h1{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:14px;margin:0;font-size:16px;font-weight:600}
h1 span{display:block;font-size:12px;font-weight:400;opacity:.7}
</style>
</head>
<body>
<h1>Wakizashi<span>Blade 500 mm · handle 180 mm · drag to rotate, scroll to zoom</span></h1>
<canvas id="v"></canvas>
<div class="hud">
<div class="box">
<label>Curvature (sori) <input id="sori" type="range" min="0" max="40" value="16" step="1"><output id="soriOut">16 mm</output></label>
<label><input id="fit" type="checkbox" checked> Handle and fittings</label>
<label><input id="wire" type="checkbox"> Wireframe</label>
</div>
<div class="box"><canvas id="sec" width="190" height="130"></canvas></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const L=500,S=200,N=22;
let sori=16;
const bladeH=s=>30-9*s,bladeT=s=>8-2*s;
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

function halfWidth(v,s){
  const t=bladeT(s),hw=t/2,sw=hw+1.3;
  const base=v<0.66?sw*v/0.66:sw+(hw-sw)*((v-0.66)/0.34);
  const ge=1-sm(0.78,0.93,s);
  const g=(v>0.7&&v<0.96)?1.5*ge*Math.sin(Math.PI*(v-0.7)/0.26):0;
  const b=sm(0.84,0.94,s);
  return Math.max((base-g)*(1-b)+hw*v*b,0.25);
}

function buildBlade(){
  const M=2*N+2,pos=new Float32Array((S+1)*M*3),col=new Float32Array((S+1)*M*3),idx=[];
  const hard=[0.86,0.88,0.92],soft=[0.34,0.38,0.47];
  for(let i=0;i<=S;i++){
    const s=i/S,h=bladeH(s),u=Math.max(0,(s-0.91)/0.09),k=Math.pow(u,1.8);
    const e=h*k,eb=sori*s*s,vh=0.27+0.035*Math.sin(s*70)+0.02*Math.sin(s*190+1)+0.55*sm(0.9,0.99,s);
    for(let r=0;r<M;r++){
      const right=r<=N,j=right?r:2*N+1-r,v=j/N;
      const w=halfWidth(v,s)*(1-k)*(right?1:-1);
      const y=eb+e+(h-e)*v;
      const o=(i*M+r)*3;
      pos[o]=s*L;pos[o+1]=y;pos[o+2]=w;
      const m=sm(vh-0.025,vh+0.025,v);
      for(let c=0;c<3;c++)col[o+c]=hard[c]*(1-m)+soft[c]*m;
    }
  }
  for(let i=0;i<S;i++)for(let r=0;r<M;r++){
    const a=i*M+r,b=i*M+(r+1)%M,c=(i+1)*M+r,d=(i+1)*M+(r+1)%M;
    idx.push(a,c,b,b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("color",new THREE.BufferAttribute(col,3));
  g.setIndex(idx);g.computeVertexNormals();
  return g;
}

const cv=document.getElementById("v");
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(35,1,1,3000);
scene.add(new THREE.AmbientLight(0xffffff,0.55));
const k1=new THREE.DirectionalLight(0xffffff,1.0);k1.position.set(200,400,500);scene.add(k1);
const k2=new THREE.DirectionalLight(0xbcd0ff,0.5);k2.position.set(-300,-100,-400);scene.add(k2);
const k3=new THREE.DirectionalLight(0xffffff,0.4);k3.position.set(0,-300,300);scene.add(k3);

const bladeMat=new THREE.MeshPhongMaterial({vertexColors:true,specular:0xaaaaaa,shininess:90,side:THREE.DoubleSide});
const blade=new THREE.Mesh(buildBlade(),bladeMat);
scene.add(blade);

const bronze=new THREE.MeshPhongMaterial({color:0xc9824f,specular:0xffd7b0,shininess:90});
const steel=new THREE.MeshPhongMaterial({color:0x8d949c,specular:0xffffff,shininess:120});
const bone=new THREE.MeshPhongMaterial({color:0xd9c39a,shininess:30});

const fit=new THREE.Group();scene.add(fit);

const tex=(()=>{
  const c=document.createElement("canvas");c.width=c.height=1024;
  const x=c.getContext("2d");
  x.fillStyle="#0b0b0d";x.fillRect(0,0,1024,1024);
  const P=1024/7,D=4*P;
  const cord=(w,col)=>{
    x.strokeStyle=col;x.lineWidth=w;
    for(let k=-4;k<=7;k++){
      const y0=k*P;
      x.beginPath();x.moveTo(0,y0);x.lineTo(1024,y0+D);x.stroke();
      x.beginPath();x.moveTo(0,y0+D);x.lineTo(1024,y0);x.stroke();
    }
  };
  cord(54,"#0b0b0d");cord(40,"#18181c");
  const len=Math.hypot(1024,D),dx=1024/len,dy=D/len;
  x.strokeStyle="rgba(100,100,110,0.55)";x.lineWidth=2;
  for(let k=-4;k<=7;k++)for(const g of [1,-1]){
    const y0=g>0?k*P:k*P+D;
    for(let t=0;t<len;t+=4){
      const px=dx*t,py=y0+g*dy*t;
      x.beginPath();x.moveTo(px+g*dy*17,py-dx*17);x.lineTo(px-g*dy*17+dx*8,py+dx*17+g*dy*8);x.stroke();
    }
  }
  const dia=(cx,cy)=>{x.beginPath();x.moveTo(cx,cy-64);x.lineTo(cx+100,cy);x.lineTo(cx,cy+64);x.lineTo(cx-100,cy);x.closePath()};
  for(const cx of [0,512,1024])for(let k=-1;k<=7;k++){
    const cy=(k+0.5)*P;
    x.save();dia(cx,cy);x.clip();
    x.fillStyle="#cfcdc6";x.fillRect(cx-100,cy-64,200,128);
    for(let r=0,py=cy-70;py<cy+70;py+=11.4,r++)for(let px=cx-106+(r%2)*5.7;px<cx+106;px+=11.4){
      x.fillStyle="#7d7b76";x.beginPath();x.arc(px,py,5.6,0,6.3);x.fill();
      x.fillStyle="#e9e8e3";x.beginPath();x.arc(px-0.8,py-0.8,4,0,6.3);x.fill();
    }
    x.restore();
    dia(cx,cy);x.strokeStyle="#0b0b0d";x.lineWidth=12;x.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.anisotropy=4;return t;
})();
const hg=new THREE.CylinderGeometry(1,1,180,64,40);
{const p=hg.attributes.position;for(let i=0;i<p.count;i++){const t=(p.getY(i)+90)/180,r=10.5+2*t+2*Math.sin(Math.PI*t);p.setX(i,p.getX(i)*r);p.setZ(i,p.getZ(i)*r)}}
hg.rotateZ(-Math.PI/2);hg.scale(1,1.15,0.8);hg.translate(-90,15,0);
fit.add(new THREE.Mesh(hg,new THREE.MeshPhongMaterial({map:tex,specular:0x222222,shininess:8})));

const pg=new THREE.SphereGeometry(1,40,20);pg.scale(10,13.2,9.4);pg.translate(-181,15,0);
fit.add(new THREE.Mesh(pg,bronze));
const pr=new THREE.CylinderGeometry(1,1,1.6,48);pr.rotateZ(-Math.PI/2);pr.scale(1,13.4,9.7);pr.translate(-178,15,0);fit.add(new THREE.Mesh(pr,bronze));
const gg=new THREE.CylinderGeometry(1,1,5,48);gg.rotateZ(-Math.PI/2);gg.scale(1,33,33);gg.translate(2.5,15,0);
fit.add(new THREE.Mesh(gg,bronze));
const fu=new THREE.CylinderGeometry(1,1,14,48);fu.rotateZ(-Math.PI/2);fu.scale(1,15.8,11.4);fu.translate(-6,15,0);fit.add(new THREE.Mesh(fu,steel));
const fr=new THREE.CylinderGeometry(1,1,1.6,48);fr.rotateZ(-Math.PI/2);fr.scale(1,15.9,11.5);fr.translate(-13.8,15,0);fit.add(new THREE.Mesh(fr,bronze));
const hb=new THREE.Mesh(new THREE.BoxGeometry(24,33,12),bronze);hb.position.set(17,15,0);fit.add(hb);
const peg=new THREE.CylinderGeometry(3,3,24,24);peg.rotateX(Math.PI/2);peg.translate(-38.6,15,0);
fit.add(new THREE.Mesh(peg,bone));

const target=new THREE.Vector3(158,22,0);
let az=0.55,el=0.22,rad=820;
function place(){
  cam.position.set(target.x+rad*Math.sin(az)*Math.cos(el),target.y+rad*Math.sin(el),target.z+rad*Math.cos(az)*Math.cos(el));
  cam.lookAt(target);
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  rad=Math.max(rad,0);if(!resize.done){rad=w/h<1?1300:820;resize.done=1}
}
addEventListener("resize",resize);resize();

const ptrs=new Map();let pinch=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener("pointerup",e=>{ptrs.delete(e.pointerId);pinch=0});
cv.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){az-=(e.clientX-p[0])*0.008;el=Math.max(-1.4,Math.min(1.4,el+(e.clientY-p[1])*0.008))}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(pinch)rad=Math.min(2000,Math.max(150,rad*pinch/d));
    pinch=d;
  }
});
cv.addEventListener("wheel",e=>{e.preventDefault();rad=Math.min(2000,Math.max(150,rad*(1+e.deltaY*0.001)))},{passive:false});

const so=document.getElementById("sori");
so.oninput=()=>{
  sori=+so.value;document.getElementById("soriOut").textContent=sori+" mm";
  blade.geometry.dispose();blade.geometry=buildBlade();
};
document.getElementById("fit").onchange=e=>{fit.visible=e.target.checked};
document.getElementById("wire").onchange=e=>{bladeMat.wireframe=e.target.checked};

const sc=document.getElementById("sec"),sx=sc.getContext("2d");
function drawSection(){
  const css=getComputedStyle(document.documentElement),fg=css.getPropertyValue("--fg").trim()||"#222";
  sx.clearRect(0,0,sc.width,sc.height);sx.font="11px system-ui";sx.fillStyle=fg;
  const items=[[0,"Base",48],[0.85,"Near tip",142]];
  for(const [s,label,cx] of items){
    const h=bladeH(s),f=3.4,y0=112;
    sx.beginPath();
    for(let j=0;j<=N;j++){const v=j/N;sx.lineTo(cx+halfWidth(v,s)*f,y0-v*h*f)}
    for(let j=N;j>=0;j--){const v=j/N;sx.lineTo(cx-halfWidth(v,s)*f,y0-v*h*f)}
    sx.closePath();sx.fillStyle="#9aa3b5";sx.fill();sx.strokeStyle=fg;sx.lineWidth=1;sx.stroke();
    sx.fillStyle=fg;sx.textAlign="center";sx.fillText(label+" "+h.toFixed(0)+" × "+bladeT(s).toFixed(0)+" mm",cx+(s?-4:20),12);
  }
}
drawSection();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",drawSection);

(function loop(){place();renderer.render(scene,cam);requestAnimationFrame(loop)})();
</script>
</body>
</html>
